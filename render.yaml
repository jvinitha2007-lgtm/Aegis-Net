services:
  - type: web
    name: aegisnet
    runtime: node
    rootDir: AegisNet (6)
    plan: free
    region: oregon
    buildCommand: npm install && npm install --prefix frontend && npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AEGIS_DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
    